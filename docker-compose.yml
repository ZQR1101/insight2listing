services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: insight2listing
      POSTGRES_USER: insight2listing
      POSTGRES_PASSWORD: insight2listing
    ports:
      - "5050:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://insight2listing:insight2listing@postgres:5432/insight2listing
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_BUCKET: insight2listing
    ports:
      - "8100:8100"
    depends_on:
      postgres:
        condition: service_started
      minio:
        condition: service_started

  web:
    build: ./apps/web
    environment:
      # Runtime target for the web API proxy; the `api` hostname resolves to
      # the api service on the compose network (no rebuild required to change).
      API_URL: http://api:8100
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: local-access-key
      MINIO_ROOT_PASSWORD: local-secret-key
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
